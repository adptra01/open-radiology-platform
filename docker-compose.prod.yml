# ORP RIS — Docker Compose PRODUKSI
#
# Stack penuh: RIS (Laravel/nginx/PHP-FPM), PostgreSQL, Orthanc, OHIF, AI Worker, Adapter.
# Jalankan:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Prasyarat:
#   - .env.prod dengan secret produksi (APP_KEY, DB_PASSWORD, ORTHANC_PASSWORD, dll)
#   - Image RIS sudah di-build: docker build -t orp-ris:latest -f ris/Dockerfile ris/
#   - Volume data/orthanc, data/postgres sudah ada atau akan dibuat
#
# Jaringan internal: orp-network (semua service saling resolve by name)
# Port eksternal: 8000 (RIS), 3000 (OHIF viewer), 8042 (Orthanc DICOMweb/REST), 4242 (DICOM)

services:
  # ----------------------------------------------------------
  # RIS — Laravel + nginx + PHP-FPM + queue worker + scheduler
  # ----------------------------------------------------------
  ris:
    image: orp-ris:latest
    container_name: orp-ris
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Laravel
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${ORP_RIS_URL:-https://ris.example.com}
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: stack
      LOG_STACK: single,json
      LOG_LEVEL: info
      LOG_JSON_DAYS: 14

      # Database (PostgreSQL service di bawah)
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: orp_ris
      DB_USERNAME: orp
      DB_PASSWORD: ${ORP_DB_PASSWORD}

      # Queue (database driver — tabel jobs sudah dibuat migrasi)
      QUEUE_CONNECTION: database
      DB_QUEUE_CONNECTION: pgsql
      DB_QUEUE_TABLE: jobs

      # Session/cache (file — bisa ganti redis bila perlu)
      SESSION_DRIVER: file
      CACHE_STORE: file

      # Orthanc (PACS) — kredensial HTTP (AuthenticationEnabled: true)
      ORP_ORTHANC_URL: http://orthanc:8042
      ORP_ORTHANC_USERNAME: ${ORP_ORTHANC_USERNAME}
      ORP_ORTHANC_PASSWORD: ${ORP_ORTHANC_PASSWORD}

      # OHIF Viewer URL (akses browser → same-origin proxy di OHIF service)
      ORP_OHIF_URL: ${ORP_OHIF_URL:-http://localhost:3000}

      # AI Worker
      ORP_AI_URL: http://ai-worker:8000

      # Sanctum / API key adapter
      ORP_RIS_API_KEY: ${ORP_RIS_API_KEY}

    volumes:
      # Log nginx/supervisor/php-fpm
      - ./logs/ris:/var/log/supervisor
      - ./logs/nginx:/var/log/nginx
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    networks:
      - orp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------------------------
  # PostgreSQL 16 (produksi)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: orp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orp_ris
      POSTGRES_USER: orp
      POSTGRES_PASSWORD: ${ORP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - orp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orp -d orp_ris"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Orthanc (PACS + DICOMweb) — AuthenticationEnabled: true
  # ----------------------------------------------------------
  orthanc:
    image: jodogne/orthanc-plugins:latest
    container_name: orp-orthanc
    restart: unless-stopped
    ports:
      - "8042:8042"   # REST + DICOMweb
      - "4242:4242"   # DICOM (C-STORE SCP / C-FIND SCP)
    environment:
      ORP_ORTHANC_USERNAME: ${ORP_ORTHANC_USERNAME}
      ORP_ORTHANC_PASSWORD: ${ORP_ORTHANC_PASSWORD}
    volumes:
      - ./platform/orthanc.json.tmpl:/etc/orthanc-orp/orthanc.json.tmpl:ro
      - ./platform/orthanc-entrypoint.sh:/usr/local/bin/orp-orthanc-entrypoint.sh:ro
      - ./data/orthanc:/var/lib/orthanc/db
    entrypoint: ["/bin/sh", "/usr/local/bin/orp-orthanc-entrypoint.sh"]
    networks:
      - orp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --user=$${ORP_ORTHANC_USERNAME} --password=$${ORP_ORTHANC_PASSWORD} http://localhost:8042/system || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # OHIF Viewer (image ohif/viewer:latest = lini v2)
  # Same-origin proxy /pacs/ → orthanc:8042 + Basic auth
  # ----------------------------------------------------------
  ohif:
    image: ohif/viewer:latest
    container_name: orp-ohif
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      ORP_ORTHANC_USERNAME: ${ORP_ORTHANC_USERNAME}
      ORP_ORTHANC_PASSWORD: ${ORP_ORTHANC_PASSWORD}
    volumes:
      - ./platform/ohif-config.js:/usr/share/nginx/html/app-config.js:ro
      - ./platform/ohif-nginx.conf.tmpl:/opt/orp/ohif-nginx.conf.tmpl:ro
      - ./platform/ohif-entrypoint.sh:/opt/orp/ohif-entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/orp/ohif-entrypoint.sh
        exec /usr/src/entrypoint.sh "$@"
      - sh
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      - orthanc
    networks:
      - orp-network

  # ----------------------------------------------------------
  # AI Worker (FastAPI inferensi CXR + TB)
  # ----------------------------------------------------------
  ai-worker:
    build:
      context: ./ai-worker
    container_name: orp-ai-worker
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      ORP_AI_DEVICE: ${ORP_AI_DEVICE:-cpu}
      ORP_AI_MODEL: ${ORP_AI_MODEL:-densenet121-res224-all}
      ORP_AI_THRESHOLD: ${ORP_AI_THRESHOLD:-0.15}
      ORP_AI_TOP_K: ${ORP_AI_TOP_K:-5}
      ORP_AI_MAX_UPLOAD_MB: ${ORP_AI_MAX_UPLOAD_MB:-25}
      # ORP_AI_TB_WEIGHTS: /weights/tb_densenet121.pt
    volumes:
      - ./ai-worker/weights:/weights:ro
    networks:
      - orp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------
  # Adapter Python (MWL/MPPS/STORE SCP)
  # ----------------------------------------------------------
  adapter:
    build:
      context: ./adapter
    container_name: orp-adapter
    restart: unless-stopped
    ports:
      - "4243:4243"
      - "4244:4244"
      - "4245:4245"
    environment:
      ORP_AE_TITLE: ${ORP_AE_TITLE:-ORPRIS}
      ORP_MWL_PORT: "4243"
      ORP_MPPS_PORT: "4244"
      ORP_STORE_PORT: "4245"
      ORP_RIS_API_URL: http://ris:8000/api
      ORP_RIS_API_KEY: ${ORP_RIS_API_KEY}
    depends_on:
      - ris
      - orthanc
    networks:
      - orp-network

volumes:
  pgdata:

networks:
  orp-network:
    driver: bridge