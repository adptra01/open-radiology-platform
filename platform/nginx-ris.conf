# ORP RIS — Nginx config untuk image produksi (nginx + PHP-FPM)
# - Port 8000
# - Static assets di /public/build (Vite manifest)
# - PHP-FPM di unix socket /var/run/php-fpm.sock
# - Healthcheck /api/health
# - Rate limit opsional untuk API

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging JSON-friendly
    log_format json_analytics escape=json
        '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;  # STOW-RS DICOM upload

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml;

    # Upstream PHP-FPM
    upstream php_fpm {
        server unix:/var/run/php-fpm.sock;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Static assets (Vite build) — long cache, immutable
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Favicon, robots, etc.
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Healthcheck (no auth)
        location = /api/health {
            fastcgi_pass php_fpm;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
            fastcgi_param HTTP_AUTHORIZATION "";
            access_log off;
        }

        # API routes (Laravel)
        location /api/ {
            try_files $uri $uri/ /index.php?$query_string;
            fastcgi_pass php_fpm;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
            fastcgi_read_timeout 120;
            fastcgi_send_timeout 120;
        }

        # Inertia/SPA fallback
        location / {
            try_files $uri $uri/ /index.php?$query_string;
            fastcgi_pass php_fpm;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
        }

        # Deny hidden files
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # PHP-FPM status (opsional, untuk monitoring)
        location = /fpm-status {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            fastcgi_pass php_fpm;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
        }
    }
}