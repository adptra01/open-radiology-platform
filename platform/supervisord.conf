; ORP RIS — Supervisor konfigurasi untuk queue worker produksi
; Jalankan di container ris (image produksi) atau host VM:
;   supervisord -c /etc/supervisor/conf.d/orp-ris.conf
; Log: /var/log/supervisor/orp-ris-*.log

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; Program: Laravel queue worker (database driver)
; - restart=unexpected: restart kalau exit code != 0
; - stopwaitsecs: beri waktu graceful shutdown (SIGTERM → 60s → SIGKILL)
; - autorestart: unexpected (bukan expected=0)
; - stdout/stderr → log file (bukan console) agar struktur JSON dari laravel log
; - process_name: agar bisa scale dengan numprocs
; - startsecs: proses dianggap start kalau hidup 5 detik
; - stopasgroup/killasgroup: kill seluruh process group (worker + child php artisan)

[program:orp-ris-queue]
command=php artisan queue:work database --queue=default --sleep=3 --tries=3 --backoff=60,180,600 --max-jobs=1000 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/log/supervisor/orp-ris-queue_%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/orp-ris-queue_%(process_num)02d.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=APP_ENV=production,LOG_CHANNEL=stack

; Program: Laravel schedule (cron replacement)
; Menjalankan `schedule:run` tiap menit. Tidak perlu numprocs > 1.

[program:orp-ris-scheduler]
command=php artisan schedule:run --verbose --no-interaction
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=30
user=www-data
stdout_logfile=/var/log/supervisor/orp-ris-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/orp-ris-scheduler.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5
environment=APP_ENV=production,LOG_CHANNEL=stack

; Program: Failed jobs monitor (opsional - bisa dipakai untuk alert)
; Menjalankan `queue:monitor` yang mengirim event Illuminate\Queue\Events\JobFailed
; Bisa dikaitkan dengan listener yang kirim notifikasi (Slack, email, dst).

[program:orp-ris-queue-monitor]
command=php artisan queue:monitor database:default --sleep=30
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=30
user=www-data
stdout_logfile=/var/log/supervisor/orp-ris-queue-monitor.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
environment=APP_ENV=production,LOG_CHANNEL=stack