; ORP RIS — Supervisor konfigurasi untuk queue worker produksi
; Jalankan di container ris (image produksi) atau host VM:
;   supervisord -c /etc/supervisor/conf.d/orp-ris.conf
; Log: /var/log/supervisor/orp-ris-*.log

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

; Program: nginx (port 8000; master + worker jalan sebagai www-data,
; pid di /tmp agar bisa tulis tanpa root)
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
user=www-data
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/nginx.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; Program: PHP-FPM (pool www.conf: user www-data, listen 127.0.0.1:9000)
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --pid /tmp/php-fpm.pid
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
user=www-data
stdout_logfile=/var/log/supervisor/php-fpm.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/php-fpm.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; Program: Laravel queue worker (database driver)
; - restart=unexpected: restart kalau exit code != 0
; - stopwaitsecs: beri waktu graceful shutdown (SIGTERM → 60s → SIGKILL)
; - autorestart: unexpected (bukan expected=0)
; - stdout/stderr → log file (bukan console) agar struktur JSON dari laravel log
; - process_name: agar bisa scale dengan numprocs
; - startsecs: proses dianggap start kalau hidup 5 detik
; - stopasgroup/killasgroup: kill seluruh process group (worker + child php artisan)

[program:orp-ris-queue]
command=php artisan queue:work database --queue=default --sleep=3 --tries=3 --backoff=60,180,600 --max-jobs=1000 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/log/supervisor/orp-ris-queue_%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/orp-ris-queue_%(process_num)02d.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=APP_ENV=production,LOG_CHANNEL=stack

; Program: Laravel schedule (cron replacement).
; schedule:run adalah one-shot (exit 0 tiap jalan) sehingga dibungkus loop
; 60 detik — supervisord me-restart loop-nya bila mati.

[program:orp-ris-scheduler]
command=sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/log/supervisor/orp-ris-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/orp-ris-scheduler.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5
environment=APP_ENV=production,LOG_CHANNEL=stack