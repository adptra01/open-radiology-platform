[project]
name = "orp-ai-worker"
version = "0.1.0"
description = "AI inference worker (CPU-only) — TorchXRayVision untuk deteksi TB & penyakit paru, untuk ORP RIS/PACS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "torchxrayvision>=0.1.18",
    "pydicom>=2.4",
    "numpy>=1.26",
    "Pillow>=10.0",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
orp-ai = "orp_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orp_ai"]

[tool.uv]
package = true

# Torch CPU-only: hindari mengunduh CUDA runtime (~2GB) untuk mesin tanpa GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
