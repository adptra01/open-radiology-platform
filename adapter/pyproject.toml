[project]
name = "orp-adapter"
version = "0.1.0"
description = "DICOM adapter (MWL/MPPS/C-STORE SCP + C-ECHO/C-STORE SCU) for ORP RIS"
requires-python = ">=3.10"
dependencies = [
    "pynetdicom>=2.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
orp-adapter = "orp_adapter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orp_adapter"]

[tool.uv]
package = true